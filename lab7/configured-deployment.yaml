apiVersion: apps/v1
kind: Deployment
metadata:
  name: configured-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: configured-nginx
  template:
    metadata:
      labels:
        app: configured-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        resources:
          requests: { memory: "64Mi", cpu: "50m" }
          limits: { memory: "128Mi", cpu: "200m" }
        env:
          - name: MY_DB_USER
            valueFrom:
              secretKeyRef:
                name: db-credentials
                key: DB_USER
          - name: MY_DB_PASS
            valueFrom:
              secretKeyRef:
                name: db-credentials
                key: DB_PASSWORD
        volumeMounts:
          - name: html-volume
            mountPath: /usr/share/nginx/html
      volumes:
        - name: html-volume
          configMap:
            name: nginx-config
            items:
              - key: custom-index.html
                path: index.html
