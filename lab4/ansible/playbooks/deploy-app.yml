---
- name: Deploy application with secrets
  hosts: web
  become: yes
  gather_facts: yes

  vars_files:
    - ../secrets.yml

  roles:
    - app

  tasks:
    - name: Verify secrets are loaded
      no_log: true
      debug:
        msg: |
          DB password length: {{ db_password | length }}
          API key starts with: {{ api_key[:7] }}...
