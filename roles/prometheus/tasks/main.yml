---
- name: Устанавливаем Prometheus
  apt:
    name: prometheus
    state: present
    update_cache: yes

- name: Убеждаемся, что директория существует
  file:
    path: /etc/prometheus
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'

- name: Удаляем старый prometheus.yml если это директория
  file:
    path: /etc/prometheus/prometheus.yml
    state: absent
  ignore_errors: yes

- name: Копируем конфиг Prometheus
  copy:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']
        - job_name: 'nodes'
          static_configs:
            - targets: ['ctrl:9100', 'node1:9100', 'node2:9100', 'mon:9100']
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: '0644'
  notify: Restart prometheus

- name: Запускаем Prometheus
  systemd:
    name: prometheus
    state: started
    enabled: yes
