---
- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Ensure nginx is running and enabled
  systemd:
    name: nginx
    state: started
    enabled: yes
    daemon_reload: yes

- name: Create custom index.html
  copy:
    content: |
      <html>
      <body>
        <h1>Welcome to Nginx deployed by Ansible!</h1>
      </body>
      </html>
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: '0644'
