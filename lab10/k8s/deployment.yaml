apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-app
  namespace: ${K8S_NAMESPACE}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-app
  template:
    metadata:
      labels:
        app: cicd-app
    spec:
      containers:
      - name: app
        image: ${CI_REGISTRY_IMAGE}:${APP_VERSION}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: APP_VERSION
          value: "${APP_VERSION}"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-app-svc
  namespace: ${K8S_NAMESPACE}
spec:
  type: NodePort
  selector:
    app: cicd-app
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 32010
